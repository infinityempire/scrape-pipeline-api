name: Scheduled scrape, build, and publish

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  scrape-and-build:
    name: Scrape source and build static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and Chromium
        run: npm ci

      - name: Scrape source and update Upstash cache
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SOURCE_PERMISSION_CONFIRMED: ${{ secrets.SOURCE_PERMISSION_CONFIRMED }}
          CACHE_TTL_SECONDS: '86400'
          SCRAPE_TIMEOUT_MS: '15000'
        run: node src/scraper.js

      - name: Generate static site
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          PAYPAL_ME_LINK: ${{ secrets.PAYPAL_ME_LINK }}
          ADSENSE_PUB_ID: ${{ secrets.ADSENSE_PUB_ID }}
          SOURCE_PERMISSION_CONFIRMED: ${{ secrets.SOURCE_PERMISSION_CONFIRMED }}
          ORIGINAL_VALUE_STATEMENT: ${{ secrets.ORIGINAL_VALUE_STATEMENT }}
          ENABLE_SEARCH_INDEXING: ${{ secrets.ENABLE_SEARCH_INDEXING }}
        run: SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" node src/build_site.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    name: Deploy GitHub Pages site
    needs: scrape-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
